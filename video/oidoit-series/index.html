<!doctype html>

<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1080, height=1920" />
<title>Sam starts small</title>

<style>
@font-face { font-family: "Jost"; src: url(assets/fonts/jost.woff2) format("woff2"); font-weight: 300 700; }
@font-face { font-family: "Cormorant"; src: url(assets/fonts/cormorant-italic.woff2) format("woff2"); font-style: italic; font-weight: 500 600; }
:root { --ink: #1d1f1c; --cream: #f8f5ef; --green: #5d7a66; --green-d: #4d6957; --sage: #9aaa91; --gold: #c8a97a; --muted: #616965; --line: #e0dbd1; --coral: #e07b55; }
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--cream); }
body { font-family: "Jost", sans-serif; color: var(--ink); -webkit-font-smoothing: antialiased; }
#root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: var(--cream); }
.layer { position: absolute; inset: 0; }
.w { display: inline-block; white-space: pre; }
.w.em { font-family: "Cormorant", serif; font-style: italic; font-weight: 600; color: var(--green); font-size: 1.14em; line-height: .9; letter-spacing: -.01em; }
svg.full { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; overflow: visible; }

/* Scene + character */
#scene { z-index: 1; }
#samLayer { z-index: 2; }
#scene, #samLayer { transform: scale(1.15); transform-origin: 500px 1180px; }
.leg { stroke: #2d3542; stroke-width: 30; stroke-linecap: round; }
.leg.back { stroke: #232a35; }
.sleeve { stroke: var(--green); stroke-width: 26; stroke-linecap: round; }
.sleeve.back { stroke: var(--green-d); }
.skin { fill: #d9a37f; }
.shoe { fill: var(--coral); stroke: var(--ink); stroke-width: 3; }
.sole { stroke: #fffaf2; stroke-width: 5; stroke-linecap: round; }
#sam.socks .shoe { fill: #f1ece2; }
#sam.socks .sole { stroke: transparent; }

/* Text */
.cap { z-index: 3; position: absolute; left: 60px; right: 60px; top: 220px; height: 440px; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; }
.cap p { font-weight: 600; font-size: 84px; line-height: 1.05; letter-spacing: -.04em; }
#hook p { font-size: 98px; line-height: 1.02; letter-spacing: -.045em; }

/* Top bar: story progress */
#top { z-index: 9; }
.bars { position: absolute; left: 60px; right: 60px; top: 64px; display: grid; grid-template-columns: repeat(10, 1fr); gap: 10px; }
.bars i { position: relative; height: 9px; border-radius: 9px; background: rgba(29,31,28,.14); overflow: hidden; }
.bars i.done { background: var(--green); }
.bars i b { position: absolute; inset: 0; background: var(--green); transform-origin: 0 50%; transform: scaleX(0); }
.tag { position: absolute; left: 60px; top: 96px; height: 64px; padding: 0 28px; border-radius: 999px; background: rgba(248,245,239,.92); box-shadow: 0 6px 20px -10px rgba(0,0,0,.25); display: flex; align-items: center; gap: 16px; font-size: 30px; font-weight: 500; }
.tag .t { font-family: "Cormorant", serif; font-style: italic; font-weight: 600; font-size: 40px; letter-spacing: -.01em; }
.tag .p { color: var(--muted); }

/* App card */
#card { z-index: 4; position: absolute; left: 60px; right: 60px; top: 1210px; height: 620px; padding: 40px 48px 44px; border-radius: 52px; background: #fffdf9; box-shadow: 0 40px 80px -30px rgba(29,31,28,.45), 0 0 0 1px rgba(29,31,28,.06); display: flex; flex-direction: column; }
.c-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 22px; }
.logo { font-weight: 700; font-size: 46px; letter-spacing: -.045em; }
.logo b { color: var(--green); font-weight: 700; }
.hi { font-size: 30px; color: var(--muted); }
.c-lbl { font-size: 26px; font-weight: 500; color: var(--muted); margin-bottom: 12px; }
.seg { position: relative; display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; padding: 8px; border-radius: 26px; background: #efebe3; margin-bottom: 26px; }
.seg span { position: relative; z-index: 1; height: 68px; display: flex; align-items: center; justify-content: center; font-size: 30px; font-weight: 500; }
#eSel { position: absolute; top: 8px; height: 68px; width: 276px; border-radius: 999px; background: #fff; box-shadow: 0 2px 6px rgba(0,0,0,.12); opacity: 0; }
.typed { position: relative; align-self: flex-start; margin: 6px 0 28px; padding: 18px 26px; border-radius: 24px; background: #efebe3; font-size: 34px; font-weight: 500; }
.typed .you { color: var(--muted); }
#strike { position: absolute; left: 22px; right: 22px; top: 50%; height: 5px; border-radius: 5px; background: var(--coral); transform-origin: 0 50%; transform: scaleX(0); }
.list { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 24px; margin: 4px 0 18px; }
.list span { display: flex; align-items: center; gap: 14px; font-size: 31px; font-weight: 500; }
.list span::before { content: "✓"; flex: none; width: 40px; height: 40px; border-radius: 50%; background: var(--green); color: #fff; font-size: 24px; display: grid; place-items: center; }
.c-eb { font-size: 24px; font-weight: 500; letter-spacing: .12em; text-transform: uppercase; color: #5b7764; margin-bottom: 10px; }
.c-step { font-size: 50px; font-weight: 600; line-height: 1.14; letter-spacing: -.03em; }
.c-note { margin-top: 12px; font-size: 30px; color: var(--muted); }
.c-act { position: relative; margin-top: auto; height: 100px; }
.btn, .done { position: absolute; inset: 0; border-radius: 30px; display: flex; align-items: center; justify-content: center; gap: 18px; font-size: 34px; font-weight: 600; }
.btn { background: var(--ink); color: #fff; }
.done { color: var(--ink); opacity: 0; font-size: 40px; }
.badge { position: relative; width: 70px; height: 70px; border-radius: 50%; background: var(--green); }
.badge::after { content: ""; position: absolute; left: 25px; top: 15px; width: 17px; height: 30px; border: solid #fff; border-width: 0 6px 6px 0; transform: rotate(45deg); }
#finger, #ripple { position: absolute; left: 0; top: 0; width: 74px; height: 74px; margin: -37px 0 0 -37px; border-radius: 50%; opacity: 0; }
#finger { z-index: 10; background: rgba(29,31,28,.28); border: 3px solid rgba(255,255,255,.9); box-shadow: 0 6px 20px rgba(0,0,0,.2); }
#ripple { z-index: 9; border: 4px solid var(--green); }

/* End hook */
#end { z-index: 5; background: rgba(23,25,22,.9); color: var(--cream); text-align: center; }
#endEb { position: absolute; left: 0; right: 0; top: 600px; font-size: 32px; font-weight: 500; letter-spacing: .2em; text-transform: uppercase; color: var(--gold); }
#endText { position: absolute; left: 70px; right: 70px; top: 680px; font-weight: 600; font-size: 104px; line-height: 1.04; letter-spacing: -.045em; }
#endText .w.em { color: #b9c9ae; }
#endFoot { position: absolute; left: 0; right: 0; top: 1300px; display: flex; flex-direction: column; align-items: center; gap: 26px; }
.next { display: inline-flex; align-items: center; gap: 18px; height: 100px; padding: 0 44px; border-radius: 999px; border: 3px solid rgba(248,245,239,.5); font-size: 40px; font-weight: 500; }
.next svg { width: 40px; height: 40px; stroke: var(--cream); stroke-width: 2.4; fill: none; stroke-linecap: round; stroke-linejoin: round; }
.logoSm { font-weight: 700; font-size: 54px; letter-spacing: -.045em; }
.logoSm b, .logoBig b { color: #9fb595; font-weight: 700; }
#endFinal { position: absolute; left: 0; right: 0; top: 1240px; display: none; }
.logoBig { font-weight: 700; font-size: 200px; line-height: 1; letter-spacing: -.055em; }
.tagline { margin-top: 24px; font-family: "Cormorant", serif; font-style: italic; font-weight: 600; font-size: 78px; color: var(--cream); }
</style>
</head>

  <div id="end" class="layer clip" data-start="12.5" data-duration="2.5" data-track-index="4">
    <p id="endEb"></p>
    <p id="endText"></p>
    <div id="endFoot"><span class="next" id="nextPill"></span><span class="logoSm">oi<b>do</b>it</span></div>
    <div id="endFinal"><div class="logoBig">oi<b>do</b>it</div><p class="tagline">Start small. Follow through.</p></div>
  </div>

  <!-- Series progress, always on top -->
  <div id="top" class="layer clip" data-start="0" data-duration="15" data-track-index="5">
    <div class="bars" id="bars"></div>
    <div class="tag"><span class="t">Sam starts small</span><span class="p" id="partLbl"></span></div>
  </div>

  <audio id="theme" data-start="0" data-duration="15" data-track-index="6" data-volume="1" src="assets/theme.wav"></audio>
</div>

<script>
(() => {
  const $ = (s) => document.querySelector(s);
  const $$ = (s, r = document) => [...r.querySelectorAll(s)];
  const vars = (window.__hyperframes && window.__hyperframes.getVariables) ? window.__hyperframes.getVariables() : {};
  const n = Math.min(10, Math.max(1, parseInt(vars.day ?? new URLSearchParams(location.search).get('day') ?? 1, 10) || 1));
  const D = window.DAYS[n - 1], C = D.card;
  const FLOOR = D.setting === 'street' ? 1525 : 1440;

  /* ---------- content ---------- */
  function setText(el, str) {          // words become spans; *text* gets the accent
    el.textContent = '';
    str.split('*').forEach((seg, i) => seg.split(/(\s+)/).forEach((w) => {
      if (!w) return;
      if (/^\s+$/.test(w)) return el.appendChild(document.createTextNode(' '));
      const s = document.createElement('span'); s.className = 'w' + (i % 2 ? ' em' : ''); s.textContent = w; el.appendChild(s);
    }));
    return [...el.querySelectorAll('.w')];
  }
  const hookW = setText($('#hookText'), D.hook), cap1W = setText($('#cap1Text'), D.cap1), cap2W = setText($('#cap2Text'), D.cap2), payW = setText($('#payText'), D.payoff);
  const stepW = C.step ? setText($('#cStep'), C.step) : [];
  $('#partLbl').textContent = `Part ${n}/10`;
  $('#bars').innerHTML = Array.from({ length: 10 }, (_, i) => `<i class="${i < n - 1 ? 'done' : ''}">${i === n - 1 ? '<b id="barNow"></b>' : ''}</i>`).join('');
  $('#cNote').textContent = C.note || '';
  $('#cEnergy').style.display = C.energy == null ? 'none' : '';
  $('#cTyped').style.display = C.typed ? '' : 'none';
  $('#typedText').textContent = C.typed ? `“${C.typed}”` : '';
  $('#cList').style.display = C.list ? '' : 'none';
  $('#cList').innerHTML = (C.list || []).map((x) => `<span>${x}</span>`).join('');
  $('#cStep').style.display = C.step ? '' : 'none';
  if (C.list) $('#cEb').textContent = `Sam’s last ${C.list.length} days`;
  if (C.button) $('#cBtn').textContent = C.button;
  if (C.done) $('#cDoneTxt').textContent = C.done;
  if (C.energy != null) $('#eSel').style.left = (8 + C.energy * 286) + 'px';
  $('#endEb').textContent = D.finale ? 'The end · Part 10 of 10' : `Up next · Part ${n + 1}`;
  const endW = setText($('#endText'), D.teaser);
  $('#nextPill').innerHTML = `Part ${n + 1} drops tomorrow<svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg>`;
  if (D.finale) { $('#endFoot').style.display = 'none'; $('#endFinal').style.display = 'block'; $('#endText').style.top = '640px'; }

  /* ---------- setting ---------- */
  $('#room').style.display = D.setting === 'room' ? '' : 'none';
  $('#street').style.display = D.setting === 'street' ? '' : 'none';
  $('#winSky').setAttribute('fill', D.sky); $('#stSky').setAttribute('fill', D.sky);
  $('#sun').style.display = D.sun ? '' : 'none';
  $('#poster').style.display = D.poster ? '' : 'none';
  $('#calendar').style.display = D.poster ? 'none' : '';
  $('#doorShoes').style.display = D.doorShoes ? '' : 'none';
  $('#cobweb').style.display = D.cobweb ? '' : 'none';
  if (D.rain) $('#rain').innerHTML = Array.from({ length: 34 }, (_, i) => { const x = 100 + ((i * 53) % 320), y = 640 + ((i * 97) % 420); return `<line x1="${x}" y1="${y}" x2="${x - 10}" y2="${y + 46}"/>`; }).join('');
  $('#fence').innerHTML = Array.from({ length: 28 }, (_, i) => `<path d="M${i * 40 + 6} 1390 L${i * 40 + 6} 1312 L${i * 40 + 18} 1298 L${i * 40 + 30} 1312 L${i * 40 + 30} 1390 Z"/>`).join('') + '<rect x="0" y="1326" width="1080" height="12"/><rect x="0" y="1362" width="1080" height="12"/>';

  /* ---------- Sam: a jointed rig driven by tweened angles ---------- */
  const POSE = {};
  const base = { torso: 0, head: 0, bsh: 10, bel: -8, fsh: -10, fel: -8, bthigh: 4, bknee: 2, fthigh: -4, fknee: 2, hipY: 0 };
  const sit = { ...base, torso: -4, bsh: 12, bel: -50, fsh: 6, fel: -60, bthigh: -86, bknee: 84, fthigh: -90, fknee: 86, hipY: 81 };
  Object.assign(POSE, {
    stand: base, sit, sitLook: { ...sit, head: -8 },
    sitSlump: { ...sit, torso: -16, head: 10, bsh: 22, bel: -18, fsh: 16, fel: -24, bthigh: -80, bknee: 72, fthigh: -82, fknee: 74 },
    sitHead: { ...sit, torso: 22, head: 26, bsh: -50, bel: -122, fsh: -56, fel: -118 },
    phoneSit: { ...sit, head: 14, bsh: -30, bel: -100, fsh: -40, fel: -95 },
    tie: { ...sit, torso: 55, head: -12, bsh: -30, bel: -10, fsh: -40, fel: -6, bthigh: -70, bknee: 116, fthigh: -74, fknee: 120 },
    sitCheer: { ...sit, head: -8, bsh: 158, bel: -12, fsh: -160, fel: -12 },
    laptop: { ...sit, head: 16, bsh: -42, bel: -58, fsh: -52, fel: -52 },
    phoneStand: { ...base, head: 14, bsh: -28, bel: -105, fsh: -38, fel: -95 },
    cheer: { ...base, head: -8, bsh: 160, bel: -12, fsh: -160, fel: -12 },
    reach: { ...base, torso: 6, fsh: -82, fel: -10 },
    slumpStand: { ...base, torso: 10, head: 22, bsh: 4, bel: -4, fsh: 2, fel: -4 },
    breath: { ...base, head: -10, bsh: 120, bel: -6, fsh: -120, fel: -6 },
    point: { ...base, head: -8, fsh: -125, fel: -6 },
    tapSign: { ...base, torso: -4, head: -14, fsh: -150, fel: -12 },
    stretchUp: { ...base, head: -6, bsh: 175, bel: 0, fsh: -175, fel: 0, bthigh: 12, fthigh: -12 },
    bounce: base, wave: { ...base, head: -4, fsh: -150, fel: -30 },
    holdBox: { ...base, head: 8, bsh: -40, bel: -72, fsh: -46, fel: -72 },
    holdBoxLook: { ...base, head: 24, bsh: -40, bel: -72, fsh: -46, fel: -72 },
  });
  const tl = gsap.timeline({ paused: true });
  // Keyframes are computed straight from time, so any seek order gives the same frame.
  const keys = []; let cur = { ...base, x: 300 }, gait = null;
  D.beats.forEach(([t, dur, pose, o]) => {
    const g0 = gait; if ('gait' in o) gait = o.gait;
    const to = { ...POSE[pose], x: o.x ?? cur.x };
    keys.push({ t, dur, from: { ...cur }, to, g0, g: gait, linX: gait === 'walk' || gait === 'run' });
    cur = to;
  });
  const events = D.beats.map(([t, , , o]) => ({ t, ...o }));
  const ease = (p) => (p < 0.5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2);
  function rigAt(t) {
    let k = keys[0]; keys.forEach((kk) => { if (kk.t <= t) k = kk; });
    const p = k.dur ? Math.min(1, Math.max(0, (t - k.t) / k.dur)) : 1, e = ease(p), s = {};
    Object.keys(k.to).forEach((key) => { s[key] = k.from[key] + (k.to[key] - k.from[key]) * (key === 'x' && k.linX ? p : e); });
    const gp = Math.min(1, Math.max(0, (t - k.t) / 0.25));
    ['walk', 'run', 'jog', 'type', 'wave', 'sway'].forEach((g) => { s[g + 'W'] = (k.g0 === g ? 1 : 0) + ((k.g === g ? 1 : 0) - (k.g0 === g ? 1 : 0)) * gp; });
    return s;
  }
  const stateAt = (t) => { const s = { mouth: 'smile', shoes: true, prop: null, facing: 1 }; events.forEach((e) => { if (e.t <= t) ['mouth', 'shoes', 'prop', 'facing'].forEach((k) => { if (e[k] !== undefined) s[k] = e[k]; }); }); return s; };
  const MOUTH = { smile: 'M28 -34 Q38 -24 48 -34', flat: 'M29 -30 L47 -30', frown: 'M29 -25 Q38 -34 47 -25', open: 'M27 -35 Q38 -14 49 -35 Z' };
  const R = {}; ['sam', 'hips', 'bThigh', 'bShin', 'fThigh', 'fShin', 'torso', 'head', 'bUp', 'bFore', 'fUp', 'fFore', 'mouth', 'phone', 'box', 'laptop'].forEach((id) => { R[id] = document.getElementById(id); });
  const rot = (el, a, tx = 0, ty = 0) => el.setAttribute('transform', `translate(${tx} ${ty}) rotate(${a.toFixed(2)})`);
  function pose(t) {
    const s = rigAt(t), P = Math.PI * 2, ev = stateAt(t);
    let tor = s.torso + 1.2 * Math.sin(t * P * 0.35), hd = s.head, bsh = s.bsh, bel = s.bel, fsh = s.fsh, fel = s.fel, bth = s.bthigh, bkn = s.bknee, fth = s.fthigh, fkn = s.fknee, bob = 0;
    if (s.walkW) { const w = s.walkW, p = t * P * 1.7, sn = Math.sin(p); fth -= 26 * sn * w; bth += 26 * sn * w; fkn += 34 * Math.max(0, Math.sin(p + 1)) * w; bkn += 34 * Math.max(0, -Math.sin(p + 1)) * w; fsh += 22 * sn * w; bsh -= 22 * sn * w; bob -= 6 * Math.abs(Math.cos(p)) * w; }
    if (s.runW) { const w = s.runW, p = t * P * 2.6, sn = Math.sin(p); fth -= 48 * sn * w; bth += 48 * sn * w; fkn += (25 + 75 * Math.max(0, Math.sin(p + 1.1))) * w; bkn += (25 + 75 * Math.max(0, -Math.sin(p + 1.1))) * w; fsh += 45 * sn * w; bsh -= 45 * sn * w; fel -= 85 * w; bel -= 85 * w; tor += 10 * w; bob -= 14 * Math.abs(Math.cos(p)) * w; }
    if (s.jogW) { const w = s.jogW, p = t * P * 2.4, sn = Math.sin(p); fth -= 40 * Math.max(0, sn) * w; bth -= 40 * Math.max(0, -sn) * w; fkn += 70 * Math.max(0, sn) * w; bkn += 70 * Math.max(0, -sn) * w; fsh += 25 * sn * w; bsh -= 25 * sn * w; fel -= 75 * w; bel -= 75 * w; bob -= 10 * Math.abs(sn) * w; }
    if (s.typeW) { fel += 7 * Math.sin(t * P * 4) * s.typeW; bel += 7 * Math.sin(t * P * 4 + 1.3) * s.typeW; }
    if (s.waveW) fel += 30 * Math.sin(t * P * 2.2) * s.waveW;
    if (s.swayW) { tor += 9 * Math.sin(t * P * 0.8) * s.swayW; }
    R.sam.setAttribute('transform', `translate(${s.x.toFixed(1)} ${FLOOR}) scale(${ev.facing} 1)`);
    R.hips.setAttribute('transform', `translate(0 ${(-201 + s.hipY + bob).toFixed(1)})`);
    rot(R.bThigh, bth); rot(R.bShin, bkn, 0, 95); rot(R.fThigh, fth); rot(R.fShin, fkn, 0, 95);
    rot(R.torso, tor); rot(R.head, hd, 0, -150); rot(R.bUp, bsh, 0, -136); rot(R.bFore, bel, 0, 72); rot(R.fUp, fsh, 0, -136); rot(R.fFore, fel, 0, 72);
    R.mouth.setAttribute('d', MOUTH[ev.mouth]); R.mouth.setAttribute('fill', ev.mouth === 'open' ? '#1d1f1c' : 'none');
    R.sam.classList.toggle('socks', !ev.shoes);
    R.phone.style.display = ev.prop === 'phone' ? '' : 'none'; R.box.style.display = ev.prop === 'box' ? '' : 'none'; R.laptop.style.display = ev.prop === 'laptop' ? '' : 'none';
  }

  /* ---------- text helpers ---------- */
  const rise = (els, at, o = {}) => els.length && tl.fromTo(els, { opacity: 0, y: o.dy ?? 44, filter: 'blur(10px)' }, { opacity: 1, y: 0, filter: 'blur(0px)', duration: o.dur ?? 0.7, ease: 'expo.out', stagger: o.stagger ?? 0.06 }, at);
  const fall = (els, at) => els.length && tl.fromTo(els, { opacity: 1, y: 0, filter: 'blur(0px)' }, { opacity: 0, y: -34, filter: 'blur(8px)', duration: 0.3, ease: 'power3.in', stagger: 0.01, immediateRender: false }, at);

  /* ---------- timeline (identical timing for every part) ---------- */
  tl.fromTo('#barNow', { scaleX: 0 }, { scaleX: 1, duration: 15, ease: 'none' }, 0);
  tl.fromTo('.tag', { opacity: 0, y: -20 }, { opacity: 1, y: 0, duration: 0.5, ease: 'power3.out' }, 0.05);
  // Opening hook
  tl.fromTo('#hookText', { scale: 1.08 }, { scale: 1, duration: 2.3, ease: 'power2.out' }, 0);
  rise(hookW, 0.12, { stagger: 0.07, dy: 60 }); fall(hookW, 2.35);
  // Scene captions
  rise(cap1W, 2.55); fall(cap1W, 4.3);
  rise(cap2W, 4.45); fall(cap2W, 6.05);
  // App card
  tl.fromTo('#card', { y: 760 }, { y: 0, duration: 0.75, ease: 'expo.out' }, 6.05);
  tl.to('#card', { y: 820, duration: 0.45, ease: 'power3.in' }, 10.25);
  const rel = (sel) => { const el = $(sel); let x = el.offsetWidth / 2, y = el.offsetHeight / 2, k = el; while (k && k.id !== 'card') { x += k.offsetLeft; y += k.offsetTop; k = k.offsetParent; } return { x, y: y + 10 }; };
  const taps = [];
  if (C.energy != null) {
    taps.push([`#e${C.energy}`, 7.0]);
    tl.fromTo('#eSel', { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.35, ease: 'back.out(2)' }, 7.0);
  }
  if (C.typed) { tl.fromTo('#cTyped', { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.4, ease: 'power3.out' }, 6.55); tl.fromTo('#strike', { scaleX: 0 }, { scaleX: 1, duration: 0.35, ease: 'power2.inOut' }, 7.0); tl.to('#typedText', { opacity: 0.45, duration: 0.3 }, 7.1); }
  if (C.list) tl.fromTo('#cList span', { opacity: 0, x: -20 }, { opacity: 1, x: 0, duration: 0.4, ease: 'back.out(1.6)', stagger: 0.16 }, 6.6);
  tl.fromTo('#cEb', { opacity: 0 }, { opacity: 1, duration: 0.3 }, C.list ? 6.4 : 7.25);
  rise(stepW, 7.35, { dy: 16, stagger: 0.045, dur: 0.6 });
  if (C.note) tl.fromTo('#cNote', { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.4 }, 8.0);
  taps.push(['#cBtn', 9.0]);
  tl.to('#cBtn', { scale: 0.95, duration: 0.09, yoyo: true, repeat: 1 }, 8.96);
  tl.to('#cBtn', { opacity: 0, duration: 0.15 }, 9.12);
  tl.fromTo('#cDone', { opacity: 0 }, { opacity: 1, duration: 0.2 }, 9.15);
  tl.fromTo('#cDone .badge', { scale: 0.4 }, { scale: 1, duration: 0.45, ease: 'back.out(2.4)' }, 9.15);
  // Finger glides between taps
  const first = taps[0][1] - 0.5;
  tl.set('#finger', { x: () => rel(taps[0][0]).x, y: () => rel(taps[0][0]).y }, first);
  tl.fromTo('#finger', { opacity: 0, scale: 1.35 }, { opacity: 1, scale: 1, duration: 0.25, immediateRender: false }, first);
  taps.forEach(([sel, T], i) => {
    if (i > 0) tl.to('#finger', { x: () => rel(sel).x, y: () => rel(sel).y, duration: 0.4, ease: 'power2.inOut' }, T - 0.45);
    tl.to('#finger', { scale: 0.78, duration: 0.08, yoyo: true, repeat: 1 }, T - 0.06);
    tl.set('#ripple', { x: () => rel(sel).x, y: () => rel(sel).y }, T);
    tl.fromTo('#ripple', { opacity: 0.7, scale: 1 }, { opacity: 0, scale: 2.4, duration: 0.5, ease: 'power2.out', immediateRender: false }, T);
  });
  tl.to('#finger', { opacity: 0, duration: 0.2 }, 9.25);
  // Payoff
  rise(payW, 10.5); fall(payW, 12.4);
  // Closing hook
  tl.fromTo('#end', { opacity: 0 }, { opacity: 1, duration: 0.35, ease: 'power2.out' }, 12.5);
  tl.to('#scene text', { opacity: 0, duration: 0.3 }, 12.5);
  tl.fromTo('#endEb', { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.4 }, 12.62);
  rise(endW, 12.72, { stagger: 0.07, dy: 50 });
  if (D.finale) {
    tl.fromTo('.logoBig', { opacity: 0, y: 60 }, { opacity: 1, y: 0, duration: 0.6, ease: 'back.out(1.6)' }, 13.5);
    tl.fromTo('.tagline', { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.5 }, 13.9);
  } else {
    tl.fromTo('#endFoot', { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.5, ease: 'power3.out' }, 13.4);
    tl.fromTo('.next svg', { x: 0 }, { x: 10, duration: 0.4, ease: 'sine.inOut', yoyo: true, repeat: 3 }, 13.7);
  }
  // Setting motion
  if (D.rain) tl.fromTo('#rain', { y: -60 }, { y: 60, duration: 0.35, ease: 'none', repeat: 42 }, 0);
  if (D.setting === 'street') tl.fromTo('#clouds', { x: -30 }, { x: 70, duration: 15, ease: 'none' }, 0);
  if (D.sun) tl.fromTo('#sun', { y: 50 }, { y: 0, duration: 15, ease: 'sine.out' }, 0);
  if (D.hideDoorShoesAt) tl.to('#doorShoes', { opacity: 0, duration: 0.25 }, D.hideDoorShoesAt);
  if (D.doorOpenAt) { tl.to('#doorPanel', { scaleX: 0.12, transformOrigin: '100% 50%', duration: 0.6, ease: 'power2.inOut' }, D.doorOpenAt); tl.to('#doorLight', { opacity: 1, duration: 0.6 }, D.doorOpenAt); }

  tl.set({}, {}, 15);
  tl.eventCallback('onUpdate', () => pose(tl.time()));
  window.__timelines = window.__timelines || {};
  window.__timelines['main'] = tl;
  tl.seek(0); pose(0);
})();
